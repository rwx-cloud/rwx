on:
  github:
    push:
      if: ${{event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

concurrency-pools:
  - id: rwx-cloud/rwx:main
    capacity: 1
    on-overflow: cancel-waiting

tasks:
  - key: ci
    call: ${{ run.dir }}/ci.yml
    init:
      commit-sha: ${{ init.commit-sha }}

  - key: integration
    call: ${{ run.dir }}/integration-launch.yml
    init:
      commit-sha: ${{ init.commit-sha }}

  - key: integration-sandbox
    call: ${{ run.dir }}/integration-launch.yml
    init:
      commit-sha: ${{ init.commit-sha }}
      definition: .rwx/integration-sandbox.yml

  - key: integration-dispatch
    call: ${{ run.dir }}/integration/dispatch-test.yml
    init:
      ref: ${{ init.commit-sha }}

  - key: integration-rwx-testing
    call: ${{ run.dir }}/integration/rwx-testing.yml
    init:
      cli: ${{ init.commit-sha }}

  - key: release-unstable
    after: [ci, integration, integration-sandbox, integration-dispatch, integration-rwx-testing]
    call: ${{ run.dir }}/release.yml
    init:
      kind: unstable
      commit: ${{ init.commit-sha }}
      version: UNSTABLE
