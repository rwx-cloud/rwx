package: true

tasks:
  - key: tool-versions
    use: package.use
    run: |
      while read -r tool version _; do
        printf "%s" "$version" > "$RWX_VALUES/$tool"
      done < .tool-versions
      cp language-server-ref "$RWX_VALUES"
    filter:
      - .tool-versions
      - language-server-ref

  - key: go-installation
    call: golang/install 1.3.1
    with:
      go-version: ${{ tasks.tool-versions.values.golang }}

  - key: go
    use: go-installation
    run: echo "$(go env GOPATH)/bin" > "$RWX_ENV/PATH"

  - key: node
    call: nodejs/install 1.2.1
    with:
      node-version: ${{ tasks.tool-versions.values.nodejs }}

  - key: go-deps
    use: [package.use, go]
    call: golang/mod-download 1.1.0
    filter: [go.mod, go.sum]
    with:
      tool-cache: cli-go-deps

  - key: golangci-lint
    use: go
    run: |
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/main/install.sh | sudo sh -s -- -b /usr/local/bin v${{ tasks.tool-versions.values.golangci-lint }}

  - key: ginkgo
    use: go
    run: go install github.com/onsi/ginkgo/v2/ginkgo@v${{ tasks.tool-versions.values.ginkgo }}

  - key: gotestsum
    use: go
    run: go install gotest.tools/gotestsum@latest

  - key: git
    run: |
      sudo apt-get update
      sudo apt-get install git git-lfs curl
      sudo apt-get clean

      git config --global user.name "Testing"
      git config --global user.email "git@example.com"
      git config --global init.defaultBranch main

      git lfs install --skip-repo

  - key: jj
    call: jj/install 1.0.1
    with:
      version: ${{ tasks.tool-versions.values.jj }}

  - key: lsp-code
    call: git/clone 2.4.0
    with:
      repository: https://github.com/rwx-cloud/language-server.git
      ref: ${{ tasks.tool-versions.values.language-server-ref }}
      path: language-server
