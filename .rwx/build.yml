on:
  cli:
    init:
      ref: ${{ event.git.sha }}

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: code
    call: git/clone 2.4.0
    with:
      preserve-git-dir: true
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.ref }}

  - key: setup
    use: code
    call: ${{ run.dir }}/packages/setup.yml

  - key: lsp-build-def
    use: [code, setup.lsp-code]
    run: |
      cp language-server/.rwx/build.yml "$RWX_ARTIFACTS/build-run-def"
      cp language-server-ref "$RWX_VALUES"

  - key: lsp-build
    call: ${{ tasks.lsp-build-def.artifacts.build-run-def }}
    init:
      ref: ${{ tasks.lsp-build-def.values.language-server-ref }}

  - key: build
    use: setup.go-deps
    run: |
      cp ${{ tasks.lsp-build.tasks.build.artifacts.bundle }} internal/lsp/bundle/server.js
      go build -a -ldflags "-w -s -X github.com/rwx-cloud/rwx/cmd/rwx/config.Version=${{ init.ref }}" ./cmd/rwx
    outputs:
      artifacts:
        - key: rwx
          path: rwx
