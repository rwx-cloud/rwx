on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      preserve-git-dir: true
      lfs: true
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.commit-sha }}

  - key: tool-versions
    use: code
    run: |
      while read -r tool version _; do
        printf "%s" "$version" > "$RWX_VALUES/$tool"
      done < .tool-versions
      cp language-server-ref "$RWX_VALUES"
    filter:
      - .tool-versions
      - language-server-ref

  - key: go-installation
    call: golang/install 1.3.0
    with:
      go-version: ${{ tasks.tool-versions.values.golang }}

  - key: go
    use: go-installation
    run: echo "$(go env GOPATH)/bin" > "$MINT_ENV/PATH"

  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: ${{ tasks.tool-versions.values.nodejs }}

  - key: go-deps
    use: [go, code]
    call: golang/mod-download 1.1.0
    filter: [go.mod, go.sum]
    with:
      tool-cache: cli-go-deps

  - key: go-tools
    use: go
    run: |
      go install github.com/onsi/ginkgo/v2/ginkgo@v${{ tasks.tool-versions.values.ginkgo }}
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/main/install.sh \
        | sudo sh -s -- -b /usr/local/bin v${{ tasks.tool-versions.values.golangci-lint }}

  - key: lsp-code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/rwx-cloud/language-server.git
      ref: ${{ tasks.tool-versions.values.language-server-ref }}
      path: language-server

  - key: lsp-build-def
    use: lsp-code
    run: cp language-server/.rwx/build.yml "$RWX_ARTIFACTS/build-run-def"

  - key: lsp-build
    call: ${{ tasks.lsp-build-def.artifacts.build-run-def }}
    init:
      ref: ${{ tasks.tool-versions.values.language-server-ref }}

  - key: lsp-server
    use: code
    run: cp ${{ tasks.lsp-build.tasks.build.artifacts.bundle }} internal/lsp/bundle/server.js

  - key: build
    use: [go-deps, lsp-server]
    run: go build ./cmd/rwx

  - key: sandbox
    use: [build, node, go-tools]
    run: |
      git config --global user.name "Testing"
      git config --global user.email "git@example.com"
      git config --global init.defaultBranch main
      rwx-sandbox
