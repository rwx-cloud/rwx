on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      preserve-git-dir: true
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github['rwx-cloud'].token }}

  - key: setup
    use: code
    call: ${{ run.dir }}/packages/setup.yml

  - key: lsp-build-def
    use: [code, setup.lsp-code]
    run: |
      cp language-server/.rwx/build.yml "$RWX_ARTIFACTS/build-run-def"
      cp language-server-ref "$RWX_VALUES"

  - key: lsp-build
    call: ${{ tasks.lsp-build-def.artifacts.build-run-def }}
    init:
      ref: ${{ tasks.lsp-build-def.values.language-server-ref }}

  - key: lsp-server
    use: code
    run: cp ${{ tasks.lsp-build.tasks.build.artifacts.bundle }} internal/lsp/bundle/server.js

  - key: unit-tests
    use: [rwx-cli, setup.gotestsum, setup.git, setup.jj]
    run: |
      gotestsum \
        --jsonfile tmp/go-test.json \
        -- \
        -ldflags "-w -s -X github.com/rwx-cloud/rwx/cmd/rwx/config.Version=testing-${{ init.commit-sha }}" \
        -parallel 4 \
        ./internal/... ./cmd/... ./test/...
    outputs:
      test-results:
        - path: tmp/go-test.json

  - key: rwx-cli
    use: [setup.go-deps, lsp-server]
    run: |
      go build -a -ldflags "-w -s -X github.com/rwx-cloud/rwx/cmd/rwx/config.Version=testing-${{ init.commit-sha }}" ./cmd/rwx

  - key: lint
    use: [setup.golangci-lint, setup.go-deps, lsp-server]
    run: golangci-lint run ./...

  - key: go-mod-tidy
    use: setup.go-deps
    run: |
      before=$(git diff)
      go mod tidy
      after=$(git diff)
      if [ "$before" != "$after" ]; then
        echo "go mod tidy produced changes"
        exit 1
      fi

  - key: go-fmt
    use: setup.go-deps
    run: |
      before=$(git diff)
      go fmt ./...
      after=$(git diff)
      if [ "$before" != "$after" ]; then
        echo "go fmt produced changes"
        exit 1
      fi
