on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}

base:
  image: ubuntu:26.04
  config: rwx/base 1.2.1

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      preserve-git-dir: true
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.commit-sha }}

  - key: setup
    use: code
    call: ${{ run.dir }}/packages/setup.yml

  - key: lsp-build-def
    use: [code, setup.lsp-code]
    run: |
      cp language-server/.rwx/build.yml "$RWX_ARTIFACTS/build-run-def"
      cp language-server-ref "$RWX_VALUES"

  - key: lsp-build
    call: ${{ tasks.lsp-build-def.artifacts.build-run-def }}
    init:
      ref: ${{ tasks.lsp-build-def.values.language-server-ref }}

  - key: lsp-server
    use: code
    run: cp ${{ tasks.lsp-build.tasks.build.artifacts.bundle }} internal/lsp/bundle/server.js

  - key: rwx-cli
    use: [setup.go-deps, lsp-server]
    run: |
      go build -a -ldflags "-w -s -X github.com/rwx-cloud/rwx/cmd/rwx/config.Version=testing-${{ init.commit-sha }}" ./cmd/rwx

  - key: generate-sandbox-tests
    use: code
    run: |
      for script in test/integration/sandbox-*.sh; do
        key=$(basename "$script" .sh)
        if [ "$key" = "sandbox-helpers" ]; then
          continue
        fi
        printf '%s\n' \
          "- key: ${key}" \
          "  use: [rwx-cli, setup.git, setup.jj]" \
          "  run: |" \
          '    git switch -c "sandbox-test-${RWX_TASK_ID}"' \
          "    ./${script}" \
          "  env:" \
          '    RWX_ACCESS_TOKEN: \${{ vaults.rwx-cli-development.service-accounts.rwx-cli-ci.token }}' \
          "    COMMIT_SHA: ${COMMIT_SHA}" \
          >> "$RWX_DYNAMIC_TASKS/sandbox-tests.yml"
      done
    env:
      COMMIT_SHA: ${{ init.commit-sha }}
    filter:
      - test/integration/sandbox-*.sh
