on:
  cli:
    init:
      ref: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.ref }}

  - key: build-def
    use: code
    run: cp .rwx/build.yml $RWX_ARTIFACTS/build-yml

  - key: build-rwx-cli
    call: ${{ tasks.build-def.artifacts.build-yml }}
    init:
      ref: ${{ init.ref }}

  - key: rwx-cli
    run: sudo install "$CLI_BINARY" /usr/local/bin
    env:
      CLI_BINARY: ${{ tasks.build-rwx-cli.tasks.build.artifacts.rwx }}

  - key: test-vaults-list
    use: rwx-cli
    run: |
      set -euo pipefail

      output=$(rwx vaults list --json)

      echo "$output" | jq -e '
        (.Vaults | type == "array") and
        any(.Vaults[]; .Name == "rwx_cli_development") and
        all(.Vaults[];
          (.Name | type == "string") and
          (.LockStatus == "locked" or .LockStatus == "unlocked") and
          (.RepositoryPermissions | type == "array") and
          all(.RepositoryPermissions[];
            (.RepositorySlug | type == "string") and
            (.BranchPattern | type == "string")
          )
        )
      ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-secrets-list
    use: rwx-cli
    run: |
      set -euo pipefail

      output=$(rwx vaults secrets list --vault rwx_cli_development --json)

      echo "$output" | jq -e '
        (.Secrets | type == "array") and
        all(.Secrets[];
          (.Name | type == "string") and
          (.Description == null or (.Description | type == "string")) and
          (has("Secret") | not) and
          (has("Value") | not)
        )
      ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-vars-list
    use: rwx-cli
    run: |
      set -euo pipefail

      output=$(rwx vaults vars list --vault rwx_cli_development --json)

      echo "$output" | jq -e '
        (.Vars | type == "array") and
        all(.Vars[];
          (.Name | type == "string") and
          (.Value | type == "string")
        )
      ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx-cli-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      updated_name="${vault_name}-updated"
      vault_created=false
      vault_deleted=false
      vault_id=""

      cleanup() {
        status=$?
        trap - EXIT
        if [ "$vault_created" = true ] && [ "$vault_deleted" = false ]; then
          vault_ref="${vault_id:-$vault_name}"
          if ! rwx vaults delete "$vault_ref" --yes >/dev/null; then
            echo "Failed to delete vault $vault_ref during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      created=$(rwx vaults create --name "$vault_name" --json)
      vault_created=true
      vault_id=$(echo "$created" | jq -er '.ID | select(type == "string" and length > 0)')
      oidc_subject=$(echo "$created" | jq -er '.OidcSubject | select(type == "string" and length > 0)')
      echo "$created" | jq -e \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg oidc_subject "$oidc_subject" '
          .Vault == $vault_name and
          .ID == $vault_id and
          .Name == $vault_name and
          .LockStatus == "locked" and
          .RepositoryPermissions == [] and
          .OidcSubject == $oidc_subject
        ' >/dev/null

      shown=$(rwx vaults show "$vault_name" --json)
      echo "$shown" | jq -e \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg oidc_subject "$oidc_subject" '
          .ID == $vault_id and
          .Name == $vault_name and
          .LockStatus == "locked" and
          .OidcSubject == $oidc_subject
        ' >/dev/null

      updated=$(rwx vaults update "$vault_id" \
        --name "$updated_name" \
        --unlocked \
        --json)
      echo "$updated" | jq -e \
        --arg vault_id "$vault_id" \
        --arg updated_name "$updated_name" \
        --arg oidc_subject "$oidc_subject" '
          .ID == $vault_id and
          .Name == $updated_name and
          .LockStatus == "unlocked" and
          .RepositoryPermissions == [] and
          .OidcSubject == $oidc_subject
        ' >/dev/null

      deleted=$(rwx vaults delete "$updated_name" --yes --json)
      vault_deleted=true
      echo "$deleted" | jq -e \
        --arg vault_id "$vault_id" \
        --arg updated_name "$updated_name" '
          .ID == $vault_id and
          .Name == $updated_name
        ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-oidc-token-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx_cli_development"
      token_name="rwx-cli-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      updated_name="${token_name}-updated"
      audience="https://rwx.com/oidc-tests/${token_name}"
      updated_audience="${audience}/updated"
      token_created=false
      token_deleted=false
      token_id=""
      vault_id=""

      cleanup() {
        status=$?
        trap - EXIT
        if [ "$token_created" = true ] && [ "$token_deleted" = false ]; then
          token_ref="${token_id:-$token_name}"
          if ! rwx vaults oidc-tokens delete "$token_ref" --vault "$vault_name" --yes >/dev/null; then
            echo "Failed to delete OIDC token $token_ref during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      created=$(rwx vaults oidc-tokens create \
        --vault "$vault_name" \
        --name "$token_name" \
        --audience "$audience" \
        --json)
      token_created=true
      token_id=$(echo "$created" | jq -er '.ID | select(type == "string" and length > 0)')
      vault_id=$(echo "$created" | jq -er '.Vault.ID | select(type == "string" and length > 0)')
      echo "$created" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg token_name "$token_name" \
        --arg audience "$audience" '
          .ID == $token_id and
          .Vault == {ID: $vault_id, Name: $vault_name} and
          .Name == $token_name and
          .Audience == $audience and
          (.Subject | type == "string" and length > 0) and
          (.Expression | type == "string" and length > 0) and
          (.DocumentationURL | type == "string" and length > 0)
        ' >/dev/null

      listed=$(rwx vaults oidc-tokens list --vault "$vault_id" --json)
      echo "$listed" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg token_name "$token_name" \
        --arg audience "$audience" '
          any(.OidcTokens[];
            .ID == $token_id and
            .Vault.ID == $vault_id and
            .Name == $token_name and
            .Audience == $audience
          )
        ' >/dev/null

      shown=$(rwx vaults oidc-tokens show "$token_name" --vault "$vault_name" --json)
      echo "$shown" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg token_name "$token_name" \
        --arg audience "$audience" '
          .ID == $token_id and
          .Vault.ID == $vault_id and
          .Name == $token_name and
          .Audience == $audience
        ' >/dev/null

      updated=$(rwx vaults oidc-tokens update "$token_id" \
        --vault "$vault_id" \
        --name "$updated_name" \
        --audience "$updated_audience" \
        --json)
      echo "$updated" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg updated_name "$updated_name" \
        --arg updated_audience "$updated_audience" '
          .ID == $token_id and
          .Vault.ID == $vault_id and
          .Name == $updated_name and
          .Audience == $updated_audience
        ' >/dev/null

      deleted=$(rwx vaults oidc-tokens delete "$updated_name" --vault "$vault_name" --yes --json)
      token_deleted=true
      echo "$deleted" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg updated_name "$updated_name" '
          . == {
            ID: $token_id,
            Vault: {ID: $vault_id, Name: $vault_name},
            Name: $updated_name
          }
        ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}
