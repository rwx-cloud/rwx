on:
  cli:
    init:
      ref: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.ref }}

  - key: build-def
    use: code
    run: cp .rwx/build.yml $RWX_ARTIFACTS/build-yml

  - key: build-rwx-cli
    call: ${{ tasks.build-def.artifacts.build-yml }}
    init:
      ref: ${{ init.ref }}

  - key: rwx-cli
    run: sudo install "$CLI_BINARY" /usr/local/bin
    env:
      CLI_BINARY: ${{ tasks.build-rwx-cli.tasks.build.artifacts.rwx }}

  - key: test-vaults-list
    use: rwx-cli
    run: |
      set -euo pipefail

      output=$(rwx vaults list --json)

      echo "$output" | jq -e '
        (.Vaults | type == "array") and
        any(.Vaults[]; .Name == "rwx_cli_development") and
        all(.Vaults[];
          (.Name | type == "string") and
          (.LockStatus == "locked" or .LockStatus == "unlocked") and
          (.RepositoryPermissions | type == "array") and
          all(.RepositoryPermissions[];
            (.RepositorySlug | type == "string") and
            (.BranchPattern | type == "string")
          )
        )
      ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-secrets-list
    use: rwx-cli
    run: |
      set -euo pipefail

      output=$(rwx vaults secrets list --vault rwx_cli_development --json)

      echo "$output" | jq -e '
        (.Secrets | type == "array") and
        all(.Secrets[];
          (.Name | type == "string") and
          (.Description == null or (.Description | type == "string")) and
          (has("Secret") | not) and
          (has("Value") | not)
        )
      ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-vars-list
    use: rwx-cli
    run: |
      set -euo pipefail

      output=$(rwx vaults vars list --vault rwx_cli_development --json)

      echo "$output" | jq -e '
        (.Vars | type == "array") and
        all(.Vars[];
          (.Name | type == "string") and
          (.Value | type == "string")
        )
      ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx-cli-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      updated_name="${vault_name}-updated"
      vault_created=false
      vault_deleted=false
      vault_id=""

      cleanup() {
        status=$?
        trap - EXIT
        if [ "$vault_created" = true ] && [ "$vault_deleted" = false ]; then
          vault_ref="${vault_id:-$vault_name}"
          if ! rwx vaults delete "$vault_ref" --yes >/dev/null; then
            echo "Failed to delete vault $vault_ref during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      created=$(rwx vaults create --name "$vault_name" --json)
      vault_created=true
      vault_id=$(echo "$created" | jq -er '.ID | select(type == "string" and length > 0)')
      oidc_subject=$(echo "$created" | jq -er '.OidcSubject | select(type == "string" and length > 0)')
      echo "$created" | jq -e \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg oidc_subject "$oidc_subject" '
          .Vault == $vault_name and
          .ID == $vault_id and
          .Name == $vault_name and
          .LockStatus == "locked" and
          .RepositoryPermissions == [] and
          .OidcSubject == $oidc_subject
        ' >/dev/null

      shown=$(rwx vaults show "$vault_name" --json)
      echo "$shown" | jq -e \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg oidc_subject "$oidc_subject" '
          .ID == $vault_id and
          .Name == $vault_name and
          .LockStatus == "locked" and
          .OidcSubject == $oidc_subject
        ' >/dev/null

      updated=$(rwx vaults update "$vault_id" \
        --name "$updated_name" \
        --unlocked \
        --json)
      echo "$updated" | jq -e \
        --arg vault_id "$vault_id" \
        --arg updated_name "$updated_name" \
        --arg oidc_subject "$oidc_subject" '
          .ID == $vault_id and
          .Name == $updated_name and
          .LockStatus == "unlocked" and
          .RepositoryPermissions == [] and
          .OidcSubject == $oidc_subject
        ' >/dev/null

      deleted=$(rwx vaults delete "$updated_name" --yes --json)
      vault_deleted=true
      echo "$deleted" | jq -e \
        --arg vault_id "$vault_id" \
        --arg updated_name "$updated_name" '
          .ID == $vault_id and
          .Name == $updated_name
        ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-repository-access-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx_cli_development"
      repository_slug="rwx-cloud/rwx"
      prefix="rwx-cli-tests/${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      first_pattern="${prefix}/first"
      second_pattern="${prefix}/second"
      first_allowed=false
      second_allowed=false
      warning_file=$(mktemp)

      cleanup() {
        status=$?
        trap - EXIT
        rm -f "$warning_file"
        if [ "$first_allowed" = true ]; then
          if ! rwx vaults access revoke --vault "$vault_name" --repository-slug "$repository_slug" --repository-branch-pattern "$first_pattern" --yes >/dev/null; then
            echo "Failed to revoke repository access for $first_pattern during cleanup" >&2
            status=1
          fi
        fi
        if [ "$second_allowed" = true ]; then
          if ! rwx vaults access revoke --vault "$vault_name" --repository-slug "$repository_slug" --repository-branch-pattern "$second_pattern" --yes >/dev/null; then
            echo "Failed to revoke repository access for $second_pattern during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      first=$(rwx vaults access allow \
        --vault "$vault_name" \
        --repository-slug "$repository_slug" \
        --repository-branch-pattern "$first_pattern" \
        --allow-for 8h \
        --json 2>"$warning_file")
      first_allowed=true
      first_id=$(echo "$first" | jq -er '.ID | select(type == "string" and length > 0)')
      vault_id=$(echo "$first" | jq -er '.Vault.ID | select(type == "string" and length > 0)')
      echo "$first" | jq -e \
        --arg first_id "$first_id" \
        --arg vault_id "$vault_id" \
        --arg repository_slug "$repository_slug" \
        --arg first_pattern "$first_pattern" '
          .ID == $first_id and
          .Vault.ID == $vault_id and
          .AccessType == "repository" and
          .RepositorySlug == $repository_slug and
          .RepositoryBranchPattern == $first_pattern
        ' >/dev/null
      grep -Fx 'Warning: repository access does not support expiration; --allow-for and --expires-at will be ignored.' "$warning_file"

      second=$(rwx vaults access allow \
        --vault "$vault_id" \
        --repository-slug "$repository_slug" \
        --repository-branch-pattern "$second_pattern" \
        --json)
      second_allowed=true
      second_id=$(echo "$second" | jq -er '.ID | select(type == "string" and length > 0)')

      listed=$(rwx vaults access list --vault "$vault_name" --json)
      echo "$listed" | jq -e \
        --arg first_id "$first_id" \
        --arg second_id "$second_id" \
        --arg repository_slug "$repository_slug" \
        --arg first_pattern "$first_pattern" \
        --arg second_pattern "$second_pattern" '
          any(.AccessGrants[];
            .ID == $first_id and
            .AccessType == "repository" and
            .RepositorySlug == $repository_slug and
            .RepositoryBranchPattern == $first_pattern
          ) and
          any(.AccessGrants[];
            .ID == $second_id and
            .AccessType == "repository" and
            .RepositorySlug == $repository_slug and
            .RepositoryBranchPattern == $second_pattern
          )
        ' >/dev/null

      revoked=$(rwx vaults access revoke \
        --vault "$vault_id" \
        --repository-slug "$repository_slug" \
        --repository-branch-pattern "$first_pattern" \
        --yes \
        --json)
      first_allowed=false
      echo "$revoked" | jq -e \
        --arg first_id "$first_id" \
        --arg repository_slug "$repository_slug" \
        --arg first_pattern "$first_pattern" '
          .ID == $first_id and
          .AccessType == "repository" and
          .RepositorySlug == $repository_slug and
          .RepositoryBranchPattern == $first_pattern
        ' >/dev/null

      listed=$(rwx vaults access list --vault "$vault_id" --json)
      echo "$listed" | jq -e \
        --arg first_id "$first_id" \
        --arg second_id "$second_id" \
        --arg repository_slug "$repository_slug" \
        --arg second_pattern "$second_pattern" '
          all(.AccessGrants[]; .ID != $first_id) and
          any(.AccessGrants[];
            .ID == $second_id and
            .AccessType == "repository" and
            .RepositorySlug == $repository_slug and
            .RepositoryBranchPattern == $second_pattern
          )
        ' >/dev/null

      rwx vaults access revoke \
        --vault "$vault_name" \
        --repository-slug "$repository_slug" \
        --repository-branch-pattern "$second_pattern" \
        --yes >/dev/null
      second_allowed=false
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-user-access-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx-cli-access-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      user_email="dan+demo@rwx.com"
      repository_slug="rwx-cloud/rwx"
      branch_pattern="rwx-cli-access/${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      vault_created=false
      vault_deleted=false
      error_file=$(mktemp)

      cleanup() {
        status=$?
        trap - EXIT
        rm -f "$error_file"
        if [ "$vault_created" = true ] && [ "$vault_deleted" = false ]; then
          if ! rwx vaults delete "$vault_name" --yes >/dev/null; then
            echo "Failed to delete vault $vault_name during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      created=$(rwx vaults create --name "$vault_name" --json)
      vault_created=true
      vault_id=$(echo "$created" | jq -er '.ID | select(type == "string" and length > 0)')

      user_expires_at=$(date -u -d '+2 days' '+%Y-%m-%dT%H:%M:%SZ')
      user_grant=$(rwx vaults access allow \
        --vault "$vault_name" \
        --email "$user_email" \
        --expires-at "$user_expires_at" \
        --json)
      user_grant_id=$(echo "$user_grant" | jq -er '.ID | select(type == "string" and length > 0)')
      echo "$user_grant" | jq -e \
        --arg vault_id "$vault_id" \
        --arg user_email "$user_email" '
          .Vault.ID == $vault_id and
          .AccessType == "user" and
          (.UserID | type == "string" and length > 0) and
          .Email == $user_email and
          (.ExpiresAt | type == "string")
        ' >/dev/null
      test "$(date -u -d "$(echo "$user_grant" | jq -er '.ExpiresAt')" '+%s')" -eq "$(date -u -d "$user_expires_at" '+%s')"

      repository_grant=$(rwx vaults access allow \
        --vault "$vault_id" \
        --repository-slug "$repository_slug" \
        --repository-branch-pattern "$branch_pattern" \
        --json)
      repository_grant_id=$(echo "$repository_grant" | jq -er '.ID | select(type == "string" and length > 0)')

      listed=$(rwx vaults access list --vault "$vault_name" --json)
      echo "$listed" | jq -e \
        --arg user_grant_id "$user_grant_id" \
        --arg repository_grant_id "$repository_grant_id" '
          any(.AccessGrants[]; .ID == $user_grant_id and .AccessType == "user") and
          any(.AccessGrants[]; .ID == $repository_grant_id and .AccessType == "repository")
        ' >/dev/null

      text_list=$(rwx vaults access list --vault "$vault_id")
      echo "$text_list" | grep -F "$user_email" >/dev/null
      echo "$text_list" | grep -F "$repository_slug" >/dev/null

      user_updated=$(rwx vaults access allow --vault "$vault_id" --email "$user_email" --json)
      echo "$user_updated" | jq -e \
        --arg user_grant_id "$user_grant_id" '
          .ID == $user_grant_id and
          .ExpiresAt == null
        ' >/dev/null

      if rwx vaults access revoke --vault "$vault_id" --email "$user_email" >"$error_file" 2>&1; then
        echo "Expected user revoke without --yes to fail" >&2
        exit 1
      fi
      grep -F 'use --yes to confirm' "$error_file" >/dev/null

      revoked_user=$(rwx vaults access revoke --vault "$vault_id" --email "$user_email" --yes --json)
      echo "$revoked_user" | jq -e --arg user_grant_id "$user_grant_id" '.ID == $user_grant_id' >/dev/null

      listed=$(rwx vaults access list --vault "$vault_id" --json)
      echo "$listed" | jq -e \
        --arg user_grant_id "$user_grant_id" '
          all(.AccessGrants[]; .ID != $user_grant_id)
        ' >/dev/null

      rwx vaults delete "$vault_id" --yes >/dev/null
      vault_deleted=true
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-service-account-access-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx-cli-service-account-access-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      service_account="rwx-cli-ci"
      vault_created=false
      vault_deleted=false

      cleanup() {
        status=$?
        trap - EXIT
        if [ "$vault_created" = true ] && [ "$vault_deleted" = false ]; then
          if ! rwx vaults delete "$vault_name" --yes >/dev/null; then
            echo "Failed to delete vault $vault_name during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      created=$(rwx vaults create --name "$vault_name" --json)
      vault_created=true
      vault_id=$(echo "$created" | jq -er '.ID | select(type == "string" and length > 0)')

      grant=$(rwx vaults access allow \
        --vault "$vault_name" \
        --service-account "$service_account" \
        --json)
      grant_id=$(echo "$grant" | jq -er '.ID | select(type == "string" and length > 0)')
      service_account_id=$(echo "$grant" | jq -er '.ServiceAccountID | select(type == "string" and length > 0)')
      echo "$grant" | jq -e \
        --arg grant_id "$grant_id" \
        --arg vault_id "$vault_id" \
        --arg service_account_id "$service_account_id" \
        --arg service_account "$service_account" '
          .ID == $grant_id and
          .Vault.ID == $vault_id and
          .AccessType == "service_account" and
          .ServiceAccountID == $service_account_id and
          .ServiceAccountName == $service_account and
          .ExpiresAt == null
        ' >/dev/null

      listed=$(rwx vaults access list --vault "$vault_id" --json)
      echo "$listed" | jq -e \
        --arg grant_id "$grant_id" \
        --arg service_account_id "$service_account_id" \
        --arg service_account "$service_account" '
          any(.AccessGrants[];
            .ID == $grant_id and
            .AccessType == "service_account" and
            .ServiceAccountID == $service_account_id and
            .ServiceAccountName == $service_account
          )
        ' >/dev/null

      revoked=$(rwx vaults access revoke \
        --vault "$vault_id" \
        --service-account "$service_account" \
        --yes \
        --json)
      echo "$revoked" | jq -e \
        --arg grant_id "$grant_id" \
        --arg service_account "$service_account" '
          .ID == $grant_id and
          .AccessType == "service_account" and
          .ServiceAccountName == $service_account
        ' >/dev/null

      listed=$(rwx vaults access list --vault "$vault_id" --json)
      echo "$listed" | jq -e --arg grant_id "$grant_id" '
        all(.AccessGrants[]; .ID != $grant_id)
      ' >/dev/null

      rwx vaults delete "$vault_id" --yes >/dev/null
      vault_deleted=true
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}

  - key: test-vault-oidc-token-lifecycle
    use: rwx-cli
    run: |
      set -euo pipefail

      vault_name="rwx_cli_development"
      token_name="rwx-cli-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      updated_name="${token_name}-updated"
      audience="https://rwx.com/oidc-tests/${token_name}"
      updated_audience="${audience}/updated"
      token_created=false
      token_deleted=false
      token_id=""
      vault_id=""

      cleanup() {
        status=$?
        trap - EXIT
        if [ "$token_created" = true ] && [ "$token_deleted" = false ]; then
          token_ref="${token_id:-$token_name}"
          if ! rwx vaults oidc-tokens delete "$token_ref" --vault "$vault_name" --yes >/dev/null; then
            echo "Failed to delete OIDC token $token_ref during cleanup" >&2
            status=1
          fi
        fi
        exit "$status"
      }
      trap cleanup EXIT

      created=$(rwx vaults oidc-tokens create \
        --vault "$vault_name" \
        --name "$token_name" \
        --audience "$audience" \
        --json)
      token_created=true
      token_id=$(echo "$created" | jq -er '.ID | select(type == "string" and length > 0)')
      vault_id=$(echo "$created" | jq -er '.Vault.ID | select(type == "string" and length > 0)')
      echo "$created" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg token_name "$token_name" \
        --arg audience "$audience" '
          .ID == $token_id and
          .Vault == {ID: $vault_id, Name: $vault_name} and
          .Name == $token_name and
          .Audience == $audience and
          (.Subject | type == "string" and length > 0) and
          (.Expression | type == "string" and length > 0) and
          (.DocumentationURL | type == "string" and length > 0)
        ' >/dev/null

      listed=$(rwx vaults oidc-tokens list --vault "$vault_id" --json)
      echo "$listed" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg token_name "$token_name" \
        --arg audience "$audience" '
          any(.OidcTokens[];
            .ID == $token_id and
            .Vault.ID == $vault_id and
            .Name == $token_name and
            .Audience == $audience
          )
        ' >/dev/null

      shown=$(rwx vaults oidc-tokens show "$token_name" --vault "$vault_name" --json)
      echo "$shown" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg token_name "$token_name" \
        --arg audience "$audience" '
          .ID == $token_id and
          .Vault.ID == $vault_id and
          .Name == $token_name and
          .Audience == $audience
        ' >/dev/null

      updated=$(rwx vaults oidc-tokens update "$token_id" \
        --vault "$vault_id" \
        --name "$updated_name" \
        --audience "$updated_audience" \
        --json)
      echo "$updated" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg updated_name "$updated_name" \
        --arg updated_audience "$updated_audience" '
          .ID == $token_id and
          .Vault.ID == $vault_id and
          .Name == $updated_name and
          .Audience == $updated_audience
        ' >/dev/null

      deleted=$(rwx vaults oidc-tokens delete "$updated_name" --vault "$vault_name" --yes --json)
      token_deleted=true
      echo "$deleted" | jq -e \
        --arg token_id "$token_id" \
        --arg vault_id "$vault_id" \
        --arg vault_name "$vault_name" \
        --arg updated_name "$updated_name" '
          . == {
            ID: $token_id,
            Vault: {ID: $vault_id, Name: $vault_name},
            Name: $updated_name
          }
        ' >/dev/null
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx_cli_development.service-accounts.rwx-cli-ci.token }}
