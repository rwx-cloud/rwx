base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: python
    run: |
      sudo apt-get update
      sudo apt-get install -y python3

  - key: app
    use: python
    app:
      endpoint: ${{ init.endpoint }}
      port: 3000
    run: |
      mkdir -p /tmp/cli-app-test
      echo "CLI app integration test" > /tmp/cli-app-test/index.html
      python3 -m http.server 3000 --directory /tmp/cli-app-test
