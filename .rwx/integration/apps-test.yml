on:
  cli:
    init:
      ref: ${{ event.git.sha }}

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/rwx-cloud/rwx.git
      ref: ${{ init.ref }}

  - key: build-def
    use: code
    run: cp .rwx/build.yml $RWX_ARTIFACTS/build-yml

  - key: build-rwx-cli
    call: ${{ tasks.build-def.artifacts.build-yml }}
    init:
      ref: ${{ init.ref }}

  - key: rwx-cli
    run: sudo install "$CLI_BINARY" /usr/local/bin
    env:
      CLI_BINARY: ${{ tasks.build-rwx-cli.tasks.build.artifacts.rwx }}

  - key: test-apps
    use: rwx-cli
    run: |
      set -euo pipefail

      endpoint="cli-app-${RWX_TASK_ID}-${RWX_TASK_ATTEMPT_NUMBER}"
      run_id=""
      fixture_ready=false
      work=$(mktemp -d)

      cleanup() {
        status=$?
        trap - EXIT
        if [ -n "$run_id" ] && [ "$fixture_ready" = false ]; then
          rwx runs cancel "$run_id" || true
        fi
        if ! rwx apps disable "$endpoint"; then
          echo "Failed to disable test endpoint $endpoint during cleanup" >&2
          status=1
        fi
        rm -rf "$work"
        exit "$status"
      }
      trap cleanup EXIT

      kickoff=$(rwx run "$RUN_DEF" --init "endpoint=$endpoint" --json)
      run_id=$(echo "$kickoff" | jq -er '.RunID | select(. != null and . != "")')
      echo "$kickoff" | jq -r '.RunURL' > "$RWX_LINKS/App fixture run"

      result=$(rwx results "$run_id" --wait --json)
      if ! echo "$result" | jq -e '.ResultStatus == "succeeded"' >/dev/null; then
        echo "App fixture run did not succeed"
        echo "$result"
        exit 1
      fi
      fixture_ready=true

      org=$(rwx whoami --json | jq -er '.organization_slug | select(. != null and . != "")')
      app_url="https://${endpoint}--${org}.rwx.run"

      for action in disable enable; do
        if [ "$action" = disable ]; then
          expected_text="Disabled app endpoint \"$endpoint\"."
          disabled=true
        else
          expected_text="Enabled app endpoint \"$endpoint\"."
          disabled=false
        fi

        output=$(rwx apps "$action" "$endpoint")
        if ! echo "$output" | grep -qF "$expected_text"; then
          echo "Unexpected $action output: $output"
          exit 1
        fi

        # Normalization and URL resolution belong to Cloud, not the CLI.
        uppercase_endpoint=$(printf '%s' "$endpoint" | tr '[:lower:]' '[:upper:]')
        for endpoint_or_url in "$endpoint" "$uppercase_endpoint" "$app_url"; do
          output=$(rwx apps "$action" "$endpoint_or_url" --json)
          if ! echo "$output" | jq -e --arg endpoint "$endpoint_or_url" --argjson disabled "$disabled" \
            '. == {Endpoint: $endpoint, Disabled: $disabled}' >/dev/null; then
            echo "Unexpected $action JSON: $output"
            exit 1
          fi
        done

        missing_endpoint="missing-$endpoint"
        if output=$(rwx apps "$action" "$missing_endpoint" 2>&1); then
          echo "Expected $action to fail for an unknown endpoint"
          exit 1
        fi
        if ! echo "$output" | grep -qF "App endpoint \"$missing_endpoint\" not found."; then
          echo "Unexpected not-found error: $output"
          exit 1
        fi
      done

      # Share URLs and cookies grant access; keep them out of task logs.
      set +x
      for mode in default custom; do
        args=("$endpoint")
        description=""
        duration=$((7 * 24 * 60 * 60))
        if [ "$mode" = custom ]; then
          description='CLI integration "share"'
          args=("$app_url" --description "$description" --expires-in 8d)
          duration=$((8 * 24 * 60 * 60))
        fi
        started=$(date +%s)
        output=$(rwx apps share "${args[@]}" --json)
        finished=$(date +%s)
        echo "$output" | jq -e \
          --arg prefix "$app_url/rwx-share?code=" --arg description "$description" \
          --argjson earliest "$((started + duration))" --argjson latest "$((finished + duration))" \
          '(.URL | startswith($prefix)) and (.Description == $description) and
           (.ExpiresAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601 | . >= $earliest and . <= $latest)' >/dev/null
        echo "Share JSON verified: $mode expiry and description"
      done

      share_url=$(rwx apps share "$endpoint" --expires-in 1h)
      [[ "$share_url" == "$app_url/rwx-share?code="* && "$share_url" != *$'\n'* ]]

      status=$(curl --silent --show-error --max-time 15 --output /dev/null \
        --dump-header "$work/unauth.headers" --write-out '%{http_code}' "$app_url/")
      test "$status" = 302
      grep -qi '^location: .*\/preview_apps\/authorizations\/new?' "$work/unauth.headers"
      echo "Private app denies unauthenticated access"

      status=$(curl --silent --show-error --max-time 15 --output "$work/handoff" \
        --write-out '%{http_code}' "$share_url")
      test "$status" = 200
      grep -q 'Opening Preview' "$work/handoff"

      # Submit the handoff form as a fresh client, without the CLI's bearer token.
      share_code="${share_url##*?code=}"
      status=$(curl --silent --show-error --max-time 15 --output /dev/null \
        --write-out '%{http_code}' --cookie-jar "$work/cookies" \
        --header "Origin: $app_url" --data-urlencode "share_code=$share_code" \
        "$app_url/.rwx/auth/share")
      test "$status" = 303

      ready=false
      for attempt in $(seq 1 30); do
        status=$(curl --silent --show-error --max-time 15 --output "$work/body" \
          --write-out '%{http_code}' --cookie "$work/cookies" "$app_url/")
        if [ "$status" = 200 ] && [ "$(cat "$work/body")" = "CLI app integration test" ]; then
          ready=true
          break
        fi
        sleep 2
      done
      if [ "$ready" != true ]; then
        echo "Shared app did not serve the fixture body (last HTTP status: $status)" >&2
        exit 1
      fi
      echo "Share text output redeemed successfully and served the private app"
    env:
      RWX_ACCESS_TOKEN: ${{ vaults.rwx-cli-development.service-accounts.rwx-cli-ci.token }}
      RUN_DEF: ${{ run.dir }}/integration/apps-test/app.yml
